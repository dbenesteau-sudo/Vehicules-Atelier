<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prêts LVA">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>LVA – Prêts véhicules salariés</title>
<style>
:root{--b:#0b3d6e;--bg:#f6f8fb;--t:#16202c;--m:#6b7785;--l:#dde3ea;--ok:#1b8a4b;--ko:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--t);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;gap:12px;align-items:center;background:#fff;border-bottom:1px solid var(--l);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));position:sticky;top:0;z-index:5}
header img{height:36px}
header b{font-size:17px;color:var(--b)}
main{max-width:640px;margin:0 auto;padding:14px}
h2{font-size:18px;margin:18px 0 8px;color:var(--b)}
label{display:block;margin:14px 0 4px;font-weight:600}
.big{display:block;width:100%;min-height:64px;margin:10px 0;border-radius:14px;border:2px solid var(--b);background:#fff;color:var(--b);font-size:18px;font-weight:700}
.primary{background:var(--b)!important;color:#fff!important}
.btn{flex:1;min-height:52px;border-radius:12px;border:2px solid var(--b);background:#fff;color:var(--b);font-size:16px;font-weight:600;padding:0 12px}
.btn:disabled{opacity:.35}
.link{background:none;border:0;color:var(--b);text-decoration:underline;font-size:16px;padding:14px 0}
.row{display:flex;gap:10px;margin:14px 0}
.inp{width:100%;min-height:50px;padding:10px 12px;font-size:17px;border:1.5px solid var(--l);border-radius:12px;background:#fff;color:var(--t)}
textarea.inp{min-height:76px}
.card{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--l);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}
.card small{color:var(--m)}
.plate{font:700 15px ui-monospace,Menlo,monospace;border:2px solid #223;border-radius:6px;padding:4px 8px;white-space:nowrap;background:#fff}
.badge{font-size:12px;font-weight:700;border-radius:6px;padding:2px 6px;background:#fde8e6;color:var(--ko)}
.muted{color:var(--m)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 16px;border-radius:24px;border:2px solid var(--l);background:#fff;font-size:16px;font-weight:600;color:var(--t)}
.chip.on{border-color:var(--b);background:var(--b);color:#fff}
.chip.ko.on{background:var(--ko);border-color:var(--ko)}
.shot{aspect-ratio:4/3;background:#e9eef4;border:2px dashed #b9c5d3;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--m)}
.shot img{width:100%;height:100%;object-fit:contain;background:#000}
.prog{height:8px;background:var(--l);border-radius:4px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--b);width:0;transition:width .3s}
.note{color:var(--m);font-size:14px;margin-top:10px}
.err{background:#fde8e6;color:var(--ko);border-radius:10px;padding:10px 12px;margin:10px 0}
.warn{background:#fff4d6;color:#7a5a00;border-radius:10px;padding:10px 12px;margin:10px 0}
.okbox{background:#e3f5ea;color:var(--ok);border-radius:10px;padding:10px 12px;margin:10px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--l)}
.kv span:first-child{color:var(--m)}
.kv span:last-child{text-align:right;font-weight:600}
canvas.sig{width:100%;height:190px;background:#fff;border:2px solid var(--b);border-radius:12px;touch-action:none;display:block}
.mention{font-size:14px;color:var(--m);margin:10px 0}
.defect{background:#fff;border:1px solid var(--l);border-radius:12px;padding:10px;margin:10px 0}
.defect img{width:100%;max-height:220px;object-fit:contain;background:#000;border-radius:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid figure{margin:0}
.grid .ph{aspect-ratio:4/3;background:#e9eef4;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--m)}
.grid img{width:100%;height:100%;object-fit:cover}
.grid figcaption{font-size:12px;color:var(--m);margin-top:2px}
.center{text-align:center}
.okmark{font-size:64px;color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;color:#fff}
.modal img{max-width:100%;max-height:80vh;object-fit:contain}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16202c;color:#fff;border-radius:22px;padding:10px 18px;z-index:30;display:none;max-width:90%}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
'use strict';
/* ===== Configuration ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbylnrUuDpgJacF36aSyDA6nSaIIiDWXS8ztQxTYqAGnY2ZBon1TRPCoc7bzv1l1mxcm/exec';
const VIEWS = ['Trois quarts avant gauche','Trois quarts avant droit','Trois quarts arrière droit','Trois quarts arrière gauche',
  'Jante avant gauche','Jante avant droite','Jante arrière droite','Jante arrière gauche','Bas de caisse gauche','Bas de caisse droit'];
const FUELS = ['Vide','1/4','1/2','3/4','Plein'];
const MENTION_DEP = 'Je reconnais avoir pris possession du véhicule désigné ci-dessus et avoir pris connaissance de son état apparent, conformément aux photographies et observations figurant sur ce document. Je m’engage à signaler tout incident ou dommage survenu pendant son utilisation.';
const MENTION_RET = 'Je confirme avoir restitué le véhicule désigné ci-dessus et avoir pris connaissance de l’état des lieux établi à la restitution, conformément aux photographies et observations figurant sur ce document.';
const DMG = { none: 'Aucun nouveau dommage constaté', new: 'Nouveau dommage constaté', check: 'Vérification complémentaire nécessaire' };
const MAX_PX = 1600, Q0 = 0.78, QMIN = 0.55, MAX_BYTES = 350 * 1024;

/* ===== Utilitaires ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const nowIso = () => new Date().toISOString();
const fmtDt = s => { if (!s) return '—'; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }); };
const fmtKm = n => (Number(n) || 0).toLocaleString('fr-FR') + ' km';
const plateKey = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const fmtPlate = s => { const k = plateKey(s), m = k.match(/^([A-Z]{2})(\d{3})([A-Z]{2})$/); return m ? m.slice(1).join('-') : k; };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
const genId = () => { const d = new Date(); return 'PV-' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + '-' + Math.random().toString(36).slice(2, 5).toUpperCase(); };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
let toastT; function toast(m, ms = 2200) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', ms); }
function app(html) { $('#app').innerHTML = html; window.scrollTo(0, 0); }
const hdr = t => `<header><img src="logo.png" alt="" onerror="this.style.display='none'"><b>${esc(t)}</b></header>`;
function match(l, q) { if (!q || !q.trim()) return true; const pk = plateKey(q); return (pk && plateKey(l.plate).includes(pk)) || norm(l.employee).includes(norm(q)); }
function errText(e) {
  const m = String(e && e.message || e);
  if (m.startsWith('DOUBLON')) return 'Un prêt est déjà en cours pour ce véhicule.';
  const map = { VERROUILLE: 'Ce dossier est verrouillé (document déjà signé et archivé).',
    HASH_DIFFERENT: 'Le PDF reçu ne correspond pas à celui envoyé. Réessayez.', KM_INCOHERENT: 'Kilométrage de retour inférieur au départ.', ETAT_INVALIDE: 'État du dossier incompatible avec cette action.' };
  if (map[m]) return map[m];
  if (m.startsWith('PHOTO_MANQUANTE')) return 'Photo manquante côté serveur (' + m.split(':')[1] + '). Réessayez.';
  return 'Connexion impossible ou erreur (' + m + '). Le dossier est conservé sur ce téléphone : réessayez.';
}

async function api(action, data = {}, retries = 2) {
  for (let i = 0; ; i++) {
    try {
      const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, data)) });
      const j = await r.json();
      if (!j.ok) throw Object.assign(new Error(j.error || 'ERREUR'), { server: true });
      return j;
    } catch (e) { if (e.server || i >= retries) throw e; await sleep(1500 * (i + 1)); }
  }
}

/* ===== Brouillons (IndexedDB) ===== */
const idb = () => new Promise((res, rej) => { const r = indexedDB.open('lva-prets', 1); r.onupgradeneeded = () => r.result.createObjectStore('d'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function dbOp(mode, fn) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('d', mode); const q = fn(t.objectStore('d')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); }
const dbSet = (k, v) => dbOp('readwrite', s => s.put(v, k));
const dbGet = k => dbOp('readonly', s => s.get(k));
const dbDel = k => dbOp('readwrite', s => s.delete(k));
const dbAll = () => dbOp('readonly', s => s.getAll());
const save = d => { if (d.id) dbSet(d.key, d).catch(() => toast('Sauvegarde locale impossible')); };

/* ===== Photos ===== */
async function compress(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight, sc = Math.min(1, MAX_PX / Math.max(w0, h0));
  const w = Math.round(w0 * sc), h = Math.round(h0 * sc), c = document.createElement('canvas');
  c.width = w; c.height = h; c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  let q = Q0, url = c.toDataURL('image/jpeg', q);
  while (url.length * 0.75 > MAX_BYTES && q > QMIN) { q -= 0.06; url = c.toDataURL('image/jpeg', q); }
  return { url, w, h };
}
function pickPhoto(cb) {
  const f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*'; f.setAttribute('capture', 'environment');
  f.onchange = async () => { if (!f.files[0]) return; toast('Compression…', 4000); try { cb(await compress(f.files[0])); } catch (e) { toast('Photo illisible, recommencez'); } };
  f.click();
}

/* ===== Écran d'accès / accueil ===== */
let LOANS = []; try { LOANS = JSON.parse(lsGet('lva_loans') || '[]'); } catch (e) {}
async function loadLoans() {
  try { LOANS = (await api('list')).loans; lsSet('lva_loans', JSON.stringify(LOANS)); return true; }
  catch (e) { return e; }
}
const card = l => `<div class="card" data-id="${esc(l.id)}"><div class="plate">${esc(fmtPlate(l.plate))}</div><div><b>${esc(l.employee)}</b>${l.status === 'EN_COURS' ? ' <span class="badge">EN COURS</span>' : ''}<br><small>Départ ${fmtDt(l.startAt)} · ${fmtKm(l.startKm)}${l.status === 'RESTITUE' ? '<br>Retour ' + fmtDt(l.endAt) + ' · ' + fmtKm(l.endKm) + ' (' + fmtKm(l.kmDone) + ' parcourus)' : ''}</small></div></div>`;
const bindCards = (box, fn) => box.querySelectorAll('.card[data-id]').forEach(c => c.onclick = () => fn(c.dataset.id));

async function home() {
  if (!API_URL.startsWith('https://')) {
    app(hdr('Prêts véhicules salariés') + `<main><div class="err">Application non configurée (URL du serveur manquante).</div></main>`); return;
  }
  app(hdr('Prêts véhicules salariés') + `<main>
    <button class="big primary" id="bDep">🚗 GÉNÉRER UN BON DE PRÊT</button>
    <button class="big" id="bRet">↩️ RESTITUER UNE VOITURE</button>
    <div id="drafts"></div><div id="net"></div>
    <h2>PRÊTS EN COURS</h2>
    <input id="q" class="inp" placeholder="Immatriculation ou nom / prénom…" autocomplete="off">
    <div id="list"></div>
    <button class="link" id="bHist">Historique des prêts terminés</button></main>`);
  $('#bDep').onclick = () => depInfo({ type: 'dep', step: 'info' });
  $('#bRet').onclick = retPick;
  $('#bHist').onclick = history_;
  const draw = () => { const f = LOANS.filter(l => l.status === 'EN_COURS' && match(l, $('#q').value)); $('#list').innerHTML = f.length ? f.map(card).join('') : '<p class="muted">Aucun prêt en cours.</p>'; bindCards($('#list'), detail); };
  $('#q').oninput = draw; draw();
  dbAll().then(ds => {
    ds = (ds || []).filter(x => x && x.key && x.type);
    $('#drafts').innerHTML = ds.map(d => `<div class="card" data-k="${esc(d.key)}">⏸ <div><b>Reprendre : ${esc(fmtPlate(d.plate || (d.loan && d.loan.plate)))}</b><br><small>${d.type === 'dep' ? 'Bon de prêt' : 'Restitution'} non terminé(e) <a href="#" data-del="${esc(d.key)}">Supprimer</a></small></div></div>`).join('');
    $('#drafts').querySelectorAll('[data-del]').forEach(a => a.onclick = async e => { e.preventDefault(); e.stopPropagation(); if (confirm('Supprimer ce brouillon ?')) { await dbDel(a.dataset.del); await dbDel('up:' + a.dataset.del); home(); } });
    $('#drafts').querySelectorAll('.card').forEach(c => c.onclick = async () => route(await dbGet(c.dataset.k)));
  }).catch(() => {});
  const r = await loadLoans();
  if (r !== true && $('#net')) $('#net').innerHTML = `<div class="warn">Hors ligne : liste enregistrée affichée.</div>`;
  if ($('#q')) draw();
}

/* ===== Routage des étapes ===== */
function route(d) {
  save(d);
  const f = { info: d.type === 'dep' ? depInfo : retInfo, photo: photoStep, defects: defectStep, compare: compareStep, sign: signStep, send: sendStep }[d.step];
  f(d);
}
const chips = (cur, id = 'fuel') => `<div class="chips" id="${id}">${FUELS.map(f => `<button type="button" class="chip ${cur === f ? 'on' : ''}" data-v="${f}">${f}</button>`).join('')}</div>`;
function bindChips(id, cb) { document.querySelectorAll('#' + id + ' .chip').forEach(c => c.onclick = () => { document.querySelectorAll('#' + id + ' .chip').forEach(x => x.classList.remove('on')); c.classList.add('on'); cb(c.dataset.v); }); }

/* ----- Départ : informations ----- */
function depInfo(d) {
  app(hdr('Nouveau bon de prêt') + `<main>
    <label>Immatriculation *</label><input class="inp" id="plate" value="${esc(d.plateDisp || '')}" autocapitalize="characters" autocomplete="off" placeholder="AB-123-CD">
    <label>Nom et prénom du salarié *</label><input class="inp" id="emp" value="${esc(d.employee || '')}" autocomplete="off">
    <label>Kilométrage au départ *</label><input class="inp" id="km" type="number" inputmode="numeric" min="0" value="${d.km == null ? '' : d.km}">
    <label>Niveau carburant / batterie *</label>${chips(d.fuel)}
    <div class="note">La date et l’heure sont enregistrées automatiquement.</div>
    <div id="msg"></div>
    <div class="row"><button class="btn" id="bBack">Annuler</button><button class="btn primary" id="bGo">Continuer</button></div></main>`);
  let fuel = d.fuel; bindChips('fuel', v => fuel = v);
  $('#plate').oninput = e => { const p = e.target.selectionStart; e.target.value = e.target.value.toUpperCase(); };
  $('#bBack').onclick = home;
  $('#bGo').onclick = async () => {
    const pk = plateKey($('#plate').value), emp = $('#emp').value.trim().replace(/\s+/g, ' '), km = $('#km').value;
    const bad = pk.length < 4 ? 'Immatriculation obligatoire.' : !emp ? 'Nom et prénom obligatoires.' : (km === '' || Number(km) < 0) ? 'Kilométrage obligatoire.' : !fuel ? 'Indiquez le niveau de carburant / batterie.' : '';
    if (bad) { $('#msg').innerHTML = `<div class="err">${bad}</div>`; return; }
    $('#bGo').disabled = true;
    const id = d.id || genId();
    try {
      const r = await api('check', { plate: pk }, 1);
      if (r.open && r.open.id !== id) {
        $('#msg').innerHTML = `<div class="err">Un prêt est déjà en cours pour ${esc(fmtPlate(pk))} (${esc(r.open.employee)}, depuis le ${fmtDt(r.open.startAt)}). <button class="link" id="bOpen">Ouvrir le dossier existant</button></div>`;
        $('#bOpen').onclick = () => detail(r.open.id); $('#bGo').disabled = false; return;
      }
    } catch (e) { toast('Contrôle des doublons impossible hors ligne : vérifié à l’envoi', 3500); }
    Object.assign(d, { type: 'dep', key: 'dep:' + id, id, plate: pk, plateDisp: fmtPlate(pk), employee: emp, km: Number(km), fuel,
      startAt: d.startAt || nowIso(), photos: d.photos || [], defects: d.defects || [], i: 0, step: 'photo' });
    route(d);
  };
}

/* ----- Photos obligatoires (départ et retour) ----- */
function photoStep(d) {
  const i = d.i, ph = d.photos[i], ret = d.type === 'ret';
  app(hdr((ret ? 'Restitution' : 'Départ') + ' · Photo ' + (i + 1) + '/10') + `<main>
    <div class="prog"><i style="width:${(i + (ph ? 1 : 0)) * 10}%"></i></div>
    <h2>${esc(VIEWS[i])}</h2>
    <div class="shot">${ph ? `<img src="${ph.url}" alt="">` : 'Aucune photo'}</div>
    <button class="big primary" id="bShot">${ph ? '📷 Reprendre la photo' : '📷 Prendre la photo'}</button>
    ${ret ? '<button class="big" id="bRef">👁 Voir la photo du départ</button>' : ''}
    <div class="row"><button class="btn" id="bPrev">← Précédent</button><button class="btn primary" id="bNext" ${ph ? '' : 'disabled'}>Suivant →</button></div></main>`);
  $('#bShot').onclick = () => pickPhoto(p => { d.photos[i] = p; route(d); });
  if (ret) $('#bRef').onclick = () => showRef(d, 'depart_' + pad(i + 1) + '.jpg', VIEWS[i]);
  $('#bPrev').onclick = () => { if (i > 0) d.i--; else d.step = 'info'; route(d); };
  $('#bNext').onclick = () => { if (i < 9) d.i++; else d.step = 'defects'; route(d); };
}
const IMG = {};
async function getImg(id, name) { const k = id + '/' + name; if (!IMG[k]) { const j = await api('getFile', { id, name }); IMG[k] = 'data:' + j.mime + ';base64,' + j.data; } return IMG[k]; }
function modalImg(url, cap) { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div>${esc(cap || '')}</div>${url ? `<img src="${url}" alt="">` : '<p>Chargement…</p>'}<p class="note">Toucher pour fermer</p>`; m.onclick = () => m.remove(); document.body.appendChild(m); return m; }
async function showRef(d, name, cap) {
  const m = modalImg(null, 'Départ : ' + cap);
  try { const u = await getImg(d.id, name); m.remove(); modalImg(u, 'Départ : ' + cap); } catch (e) { m.remove(); toast('Photo du départ indisponible (réseau)'); }
}

/* ----- Photos de défauts ----- */
function defectStep(d) {
  const ret = d.type === 'ret';
  app(hdr(ret ? 'Nouveaux dégâts' : 'Défauts constatés') + `<main>
    <button class="big primary" id="bAdd">📷 ${ret ? 'AJOUTER DES PHOTOS DE NOUVEAUX DÉGÂTS' : 'AJOUTER DES PHOTOS DES DÉFAUTS'}</button>
    <div id="dl">${d.defects.map((x, k) => `<div class="defect"><img src="${x.url}" alt=""><textarea class="inp" data-k="${k}" placeholder="Commentaire (facultatif) : rayure sur une porte, jante abîmée…">${esc(x.comment || '')}</textarea><button class="btn" data-rm="${k}" style="width:100%;margin-top:8px">Supprimer cette photo</button></div>`).join('')}</div>
    <p class="note">${d.defects.length ? d.defects.length + ' photo(s) ajoutée(s).' : 'Facultatif : passez à l’étape suivante s’il n’y a rien à signaler.'}</p>
    <div class="row"><button class="btn" id="bPrev">← Précédent</button><button class="btn primary" id="bNext">${d.defects.length ? 'Continuer' : 'Aucun défaut → Continuer'}</button></div></main>`);
  $('#bAdd').onclick = () => pickPhoto(p => { d.defects.push(Object.assign(p, { comment: '' })); route(d); });
  let t; document.querySelectorAll('textarea[data-k]').forEach(a => a.oninput = () => { d.defects[a.dataset.k].comment = a.value; clearTimeout(t); t = setTimeout(() => save(d), 500); });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { d.defects.splice(b.dataset.rm, 1); route(d); });
  $('#bPrev').onclick = () => { d.step = 'photo'; d.i = 9; route(d); };
  $('#bNext').onclick = () => { save(d); d.step = ret ? 'compare' : 'sign'; route(d); };
}

/* ----- Signature ----- */
function sigPad(cv) {

  cv.addEventListener('pointermove', e => { if (!down) return; const [p, q] = pos(e); x.lineTo(p, q); x.stroke(); x.beginPath(); x.moveTo(p, q); e.preventDefault(); });
  ['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => down = false));
  return { clear() { x.clearRect(0, 0, cv.width, cv.height); ink = false; }, hasInk: () => ink };
}

  app(hdr('Récapitulatif et signature') + `<main>${rows.map(r => `<div class="kv"><span>${r[0]}</span><span>${esc(r[1])}</span></div>`).join('')}

let LOGO;
async function logo() {

  try {
    const r = await fetch('logo.png'); if (!r.ok) throw 0;
    const b = await r.blob(), url = await new Promise(res => { const f = new FileReader(); f.onload = () => res(f.result); f.readAsDataURL(b); });
    const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });

  } catch (e) { LOGO = null; }

}

async function buildPdf(d) {

    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.text('N° ' + d.id, W - M, 14, { align: 'right' }); y = 32;
  };
  const ensure = h => { if (y + h > 284) { doc.addPage(); head(); } };
  const title = t => { doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.text(t, M, y); y += 9; };
  const section = t => { ensure(14); y += 3; doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text(t, M, y); doc.setDrawColor(11, 61, 110); doc.line(M, y + 1.5, W - M, y + 1.5); y += 7; };
  const kv = (k, v) => { ensure(6); doc.setFontSize(10); doc.setFont('helvetica', 'bold'); doc.text(k, M, y); doc.setFont('helvetica', 'normal'); const t = doc.splitTextToSize(String(v), W - M - 70); doc.text(t, M + 56, y); y += 5.5 * t.length; };
  const fit = (p, x, yy, bw, bh) => { const r = Math.min(bw / p.w, bh / p.h), dw = p.w * r, dh = p.h * r; doc.addImage(p.url, 'JPEG', x + (bw - dw) / 2, yy + (bh - dh) / 2, dw, dh, undefined, 'FAST'); };

  if (!dep) {

  else { section(dep ? 'Défauts constatés au départ' : 'Nouveaux dégâts constatés'); ensure(8); doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.text('Aucun.', M, y); y += 6; }
  section('Reconnaissance et signature');
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); const mt = doc.splitTextToSize(dep ? MENTION_DEP : MENTION_RET, W - 2 * M); ensure(mt.length * 5 + 52); doc.text(mt, M, y); y += mt.length * 5 + 3;
  const r = Math.min(70 / d.sig.w, 30 / d.sig.h); doc.addImage(d.sig.url, 'PNG', M, y, d.sig.w * r, d.sig.h * r); y += 32;

async function sendStep(d) {
  const dep = d.type === 'dep', pre = dep ? 'depart' : 'retour';
  app(hdr('Enregistrement') + `<main><div class="prog"><i id="pb"></i></div><p id="st">Préparation…</p><div id="err"></div></main>`);
  const st = t => { const e = $('#st'); if (e) e.textContent = t; }, pb = p => { const e = $('#pb'); if (e) e.style.width = p + '%'; };
  try {
    d.up = (await dbGet('up:' + d.key)) || {};

    const tasks = d.photos.map((p, k) => ({ name: pre + '_' + pad(k + 1) + '.jpg', mime: 'image/jpeg', data: p.url.split(',')[1] }))

  const draw = () => {
    const q = $('#q').value, f = LOANS.filter(l => (q.trim() ? true : l.status === 'RESTITUE') && match(l, q)).sort((a, b) => (b.startAt || '').localeCompare(a.startAt || ''));
    $('#sum').textContent = q.trim() ? f.length + ' prêt(s) · ' + new Set(f.map(l => l.plate)).size + ' véhicule(s) · ' + new Set(f.map(l => norm(l.employee))).size + ' salarié(s)' : 'Prêts terminés (les plus récents en premier)';
    $('#list').innerHTML = f.length ? f.map(card).join('') : '<p class="muted">Aucun résultat.</p>'; bindCards($('#list'), detail);
  };
  $('#q').oninput = draw; draw(); await loadLoans(); if ($('#q')) draw();
}

/* ===== Démarrage ===== */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
home();
</script>
</body>
